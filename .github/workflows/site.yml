# Robô do Brasil em Camadas
# - Todo dia 3 de cada mês (e quando você clicar em "Run workflow"): busca dados novos do IBGE e da ANP e salva no repositório.
# - Depois de cada mudança: publica o site no GitHub Pages.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 9 3 * *"   # dia 3, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados do IBGE
        run: python scripts/atualizar_ibge.py
      # Se a ANP falhar, o robô mantém os arquivos antigos e o site é publicado mesmo assim (com a data antiga à vista).
      - name: Buscar dados da ANP (petróleo e gás)
        continue-on-error: true
        run: python scripts/atualizar_anp.py
      - name: Salvar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "Atualiza dados do IBGE e da ANP" && git push)

  publicar:
    needs: atualizar
    if: always() && needs.atualizar.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
