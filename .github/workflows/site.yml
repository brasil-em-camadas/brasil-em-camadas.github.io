# Robô do Brasil em Camadas
# - Todo dia 3 de cada mês (e quando você clicar em "Run workflow"): busca dados novos do IBGE, da ANP, da ANEEL, da EPE, da Anatel, da ANTT, da ANAC e do Ministério da Defesa e salva no repositório.
# - Depois de cada mudança: publica o site no GitHub Pages.
# Versões das ações conferidas em 21/10/2026 (todas em Node 24; o Node 20 foi descontinuado pelo GitHub).
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 9 3 * *"   # dia 3, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Buscar dados do IBGE
        run: python scripts/atualizar_ibge.py
      # Se a ANP falhar, o robô mantém os arquivos antigos e o site é publicado mesmo assim (com a data antiga à vista).
      - name: Buscar dados da ANP (petróleo e gás)
        continue-on-error: true
        run: python scripts/atualizar_anp.py
      # Energia elétrica: usinas e soma por estado do SIGA da ANEEL (atualizado todo dia); se falhar, ficam os arquivos antigos.
      - name: Buscar as usinas (ANEEL, SIGA)
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/atualizar_aneel.py
      # Linhas de transmissão e subestações do Webmap da EPE; se falhar, ficam os arquivos antigos.
      - name: Buscar dados da EPE (linhas de transmissão e subestações)
        continue-on-error: true
        run: python scripts/atualizar_epe.py
      # Telefonia celular e internet dos dados abertos da Anatel: sinal 4G/5G, municípios com 5G, moradores com sinal 5G,
      # velocidade medida no celular (arquivo de ≈ 1 GB, só baixado quando a Anatel publica um novo) e banda larga fixa
      # (só os dois arquivos usados, de dentro do zip de ≈ 1 GB); se falhar, ficam os arquivos antigos.
      - name: Buscar dados da Anatel (celular e internet)
        continue-on-error: true
        timeout-minutes: 40
        run: python scripts/atualizar_anatel.py
      # Tráfego nos pedágios federais (ANTT); o servidor da ANTT às vezes demora, então o passo tem limite de tempo; se falhar, ficam os arquivos antigos.
      - name: Buscar o tráfego nos pedágios federais (ANTT)
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/atualizar_antt.py
      # Aeroportos: aeródromos públicos e passageiros de 12 meses (ANAC; o arquivo de estatísticas tem ~360 MB e é lido aos poucos).
      - name: Buscar os aeroportos (ANAC)
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/atualizar_anac.py
      # Indústria de defesa: lista das empresas credenciadas pelo Ministério da Defesa (planilha do gov.br); se falhar, ficam os arquivos antigos.
      - name: Buscar a lista da indústria de defesa (Ministério da Defesa)
        continue-on-error: true
        run: python scripts/atualizar_defesa.py
      - name: Salvar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "Atualiza dados do IBGE, da ANP, da ANEEL, da EPE, da Anatel, da ANTT, da ANAC e da Defesa" && git push)

  publicar:
    needs: atualizar
    if: always() && needs.atualizar.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
